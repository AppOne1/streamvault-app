<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 3D Purple & Neon Indigo Background Gradient (Matching Header ODLogo) -->
    <linearGradient id="odBgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="52%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- 3D Bottom Bevel Lip -->
    <linearGradient id="odBevelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Crisp 3D Neon White-to-Ice-Blue Monogram Gradient -->
    <linearGradient id="odTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Vibrant Golden-Orange 3D Download Arrow Gradient -->
    <linearGradient id="odArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="odDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#090d16" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 3D Rounded App Squircle Base with Bottom 3D Lip -->
  <rect x="16" y="28" width="480" height="472" rx="116" fill="url(#odBevelGrad)" />
  <rect x="16" y="12" width="480" height="468" rx="116" fill="url(#odBgGrad)" />

  <!-- Top Specular Highlight Border -->
  <rect x="20" y="16" width="472" height="460" rx="112" stroke="#ffffff" stroke-opacity="0.32" stroke-width="5" fill="none" />

  <!-- Ambient Neon Purple Glow -->
  <circle cx="256" cy="230" r="185" fill="#8b5cf6" opacity="0.24" />

  <!-- 3D "OD" Monogram + Orange Download Indicator -->
  <g filter="url(#odDropShadow)">
    <!-- Bold 3D "O" -->
    <rect x="68" y="96" width="162" height="208" rx="81" stroke="url(#odTextGrad)" stroke-width="42" fill="none" />

    <!-- Bold 3D "D" -->
    <path d="M284 96 H354 C412 96 446 136 446 200 C446 264 412 304 354 304 H284 Z" stroke="url(#odTextGrad)" stroke-width="42" stroke-linejoin="round" fill="none" />

    <!-- 3D Orange Download Arrow & Tray -->
    <path d="M256 264 V394" stroke="url(#odArrowGrad)" stroke-width="38" stroke-linecap="round" />
    <path d="M194 338 L256 402 L318 338" stroke="url(#odArrowGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M132 436 H380" stroke="url(#odArrowGrad)" stroke-width="32" stroke-linecap="round" />
  </g>
</svg>
