<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border glow -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Outer Sound/Stream Wave Ring -->
  <circle cx="256" cy="256" r="160" stroke="#312e81" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Media Play & Download Arrow Combination Shape -->
  <g filter="url(#shadow)">
    <!-- Stream play polygon backdrop -->
    <path d="M192 144 L380 256 L192 368 Z" fill="url(#primary-grad)" opacity="0.15" />
    
    <!-- Central Modern Download Arrow with Stream Bars -->
    <path d="M256 128 V304" stroke="url(#glow-grad)" stroke-width="32" stroke-linecap="round" />
    <path d="M184 240 L256 312 L328 240" fill="none" stroke="url(#glow-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Modern Base Tray (Vault cradle) -->
    <path d="M148 348 C148 368 164 384 184 384 H328 C348 384 364 368 364 348" stroke="url(#primary-grad)" stroke-width="28" stroke-linecap="round" />
  </g>

  <!-- Pulse dots -->
  <circle cx="256" cy="76" r="10" fill="#38bdf8" />
  <circle cx="436" cy="256" r="8" fill="#8b5cf6" />
  <circle cx="76" cy="256" r="8" fill="#ec4899" />
</svg>
