<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="od-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="3d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020617" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 3D Rounded App Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)" />
  <rect x="14" y="14" width="484" height="484" rx="104" stroke="url(#od-gold)" stroke-width="6" stroke-opacity="0.45" fill="none" />

  <!-- Subtle Glow Halo -->
  <circle cx="256" cy="240" r="185" fill="#4f46e5" opacity="0.18" />

  <!-- Bold 3D Monogram "O" (Left) & "D" (Right) -->
  <g filter="url(#3d-shadow)">
    <!-- Letter O -->
    <rect x="68" y="118" width="164" height="210" rx="82" stroke="url(#od-gold)" stroke-width="40" fill="none" />
    <!-- Letter D -->
    <path d="M284 118 H354 C412 118 446 158 446 223 C446 288 412 328 354 328 H284 Z" stroke="url(#od-gold)" stroke-width="40" stroke-linejoin="round" fill="none" />

    <!-- Iconic 3D Download Arrow & Tray Integrated Below / Through OD -->
    <path d="M256 265 V402" stroke="url(#arrow-grad)" stroke-width="34" stroke-linecap="round" />
    <path d="M198 352 L256 410 L314 352" stroke="url(#arrow-grad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M132 438 H380" stroke="url(#arrow-grad)" stroke-width="26" stroke-linecap="round" />
  </g>
</svg>
