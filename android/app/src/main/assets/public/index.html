      /* Stub Vite HMR WebSocket in cloud proxy/iframe environment */
      (function() {
        if (typeof window === 'undefined') return;

        function MockViteWS(url, protocols) {
          var isVite = (protocols && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
                       (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1 || url.indexOf('/@vite') !== -1));
          if (isVite) {
            var target = new EventTarget();
            target.url = String(url);
            target.protocol = String(protocols || '');
            target.readyState = 1; // WebSocket.OPEN
            target.OPEN = 1;
            target.CONNECTING = 0;
            target.CLOSING = 2;
            target.CLOSED = 3;
            target.binaryType = 'blob';
            target.bufferedAmount = 0;
            target.extensions = '';
            target.send = function() {};
            target.close = function() {
              target.readyState = 3;
            };
            ['open', 'close', 'error', 'message'].forEach(function(evt) {
              var handlerKey = 'on' + evt;
              var handler = null;
              Object.defineProperty(target, handlerKey, {
                get: function() { return handler; },
                set: function(fn) {
                  if (handler) target.removeEventListener(evt, handler);
                  handler = fn;
                  if (fn) target.addEventListener(evt, fn);
                }
              });
            });
            setTimeout(function() {
              target.dispatchEvent(new Event('open'));
            }, 10);
            return target;
          }
          return new OrigWS(url, protocols);
        }
        MockViteWS.CONNECTING = 0;
        MockViteWS.OPEN = 1;
        MockViteWS.CLOSING = 2;
        MockViteWS.CLOSED = 3;
        MockViteWS.prototype = OrigWS.prototype;
        window.WebSocket = MockViteWS;
      })();

      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

    <script>
      try {
